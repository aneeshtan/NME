# ─────────────────────────────────────────────────────────────────────────────
#  coturn — TURN relay for participants whose network blocks direct media.
#
#  Deploy on a host where port 443 is free. Media crossing this relay is
#  encrypted twice over (DTLS-SRTP, plus the application's own AES-GCM frame
#  encryption), so this server forwards bytes it cannot read. It is a transport
#  of last resort, not a trusted component.
#
#  Install:  apt-get install -y coturn
#  Enable:   sed -i 's/^#TURNSERVER_ENABLED/TURNSERVER_ENABLED/' /etc/default/coturn
#  Config:   cp this file to /etc/turnserver.conf and edit the marked values
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ────────────────────────────────────────────────────────────────
# EDIT: the hostname clients connect to. Must match the TLS certificate.
realm=turn.nmetalk.com
server-name=turn.nmetalk.com

# ── Listening ───────────────────────────────────────────────────────────────
# 443 is the entire point: on a firewall that permits only HTTPS, TURN over TLS
# on 443 is indistinguishable from ordinary web traffic and gets through.
tls-listening-port=443

# Plain (non-TLS) TURN is deliberately NOT enabled. It would expose the relay
# control channel and the credential on the wire, and would be blocked by the
# very networks this exists to serve. The application refuses to start with a
# `turn:` URL for the same reason.
#
# EDIT: the public IP of this host.
listening-ip=0.0.0.0
external-ip=YOUR_PUBLIC_IP

# Relay port range. Narrow, because an SFU deployment needs far fewer
# allocations than a general-purpose public relay.
min-port=49160
max-port=49200

# ── Authentication ──────────────────────────────────────────────────────────
# Ephemeral credentials (RFC 5766 REST API scheme). The application derives
# username/password from this same secret per participant; coturn recomputes
# the HMAC and rejects anything expired or forged. No long-lived credential
# exists anywhere, and nothing is embedded in the frontend bundle.
#
# EDIT: must byte-for-byte match TURN_AUTH_SECRET in the application's .env.
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_AUTH_SECRET

# Anonymous relaying would turn this into an open proxy within hours.
no-auth-pings
denied-peer-ip=0.0.0.0-0.255.255.255

# ── TLS ─────────────────────────────────────────────────────────────────────
# EDIT: certificate paths. Obtain with:
#   certbot certonly --standalone -d turn.nmetalk.com
# Note certbot needs port 80 free during issuance and renewal.
cert=/etc/letsencrypt/live/turn.nmetalk.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.nmetalk.com/privkey.pem

# TLS 1.2 is the floor; 1.0/1.1 are broken and 1.3 is negotiated when the
# client supports it.
no-tlsv1
no-tlsv1_1

# Forward-secret AEAD suites only.
cipher-list="ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256"

# ── Hardening ───────────────────────────────────────────────────────────────
# Refuse to relay to private/loopback ranges. Without this, anyone holding a
# credential could reach services on this host's internal network — the classic
# TURN-as-SSRF-pivot problem.
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# The multicast range has no legitimate use here and is a known amplification
# vector.
denied-peer-ip=224.0.0.0-239.255.255.255

# Bound resource use per credential so one client cannot exhaust the relay.
user-quota=12
total-quota=1200
max-bps=1000000

# CLI admin interface listens on localhost by default; disable it entirely
# since it is not used and is a needless local attack surface.
no-cli

# Drop privileges after binding 443.
proc-user=turnserver
proc-group=turnserver

# Log to syslog rather than a file that grows unbounded. Note coturn logs
# client IP addresses — set `no-stdout-log` and review retention if that
# matters for your jurisdiction.
syslog
