name: NME

options:
  bundleIdPrefix: com.ctrlaltl
  deploymentTarget:
    iOS: "16.4"
  groupSortPosition: top
  # Keeps LastUpgradeCheck current so Xcode stops rewriting the generated
  # project and scheme behind xcodegen's back.
  xcodeVersion: "26.6"

packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.13.0

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NME:
    type: application
    platform: iOS
    sources:
      - path: NME
        excludes:
          - Resources/Info.plist
          - Resources/NME.entitlements
    configFiles:
      Debug: Configuration/Debug.xcconfig
      Release: Configuration/Release.xcconfig
    dependencies:
      - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrlaltl.nme
        DEVELOPMENT_TEAM: WC955H63L3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NME/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NME/Resources/NME.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

  NMETests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NMETests
      - path: NME/Resources/NME.entitlements
        buildPhase: resources
      - path: ../web/public/.well-known/apple-app-site-association
        buildPhase: resources
      - path: project.yml
        buildPhase: resources
    dependencies:
      - target: NME
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrlaltl.nme.tests

  NMEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NMEUITests
    dependencies:
      - target: NME
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ctrlaltl.nme.uitests

schemes:
  NME:
    build:
      targets:
        NME: all
        NMETests:
          - test
        NMEUITests:
          - test
    test:
      gatherCoverageData: true
      targets:
        - name: NMETests
        - name: NMEUITests
