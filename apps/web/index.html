<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `maximum-scale`/`user-scalable` state the intent: this is an app shell that
      always fits its viewport, so there is nothing to zoom into and a stray
      pinch during a call should not leave the toolbar off screen. iOS Safari
      deliberately ignores both for a pinch gesture — see the 16px control floor
      in styles.css, which is what actually stops Safari zooming in by itself
      when a text field takes focus.

      Heights are deliberately not set here: the `h-full` classes this element
      used to carry resolved to `height: 100%`, which on a phone measures the
      viewport as though the browser toolbars were retracted and pushed the
      bottom of the UI off screen. The height chain lives in styles.css and is
      expressed in `dvh`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>NME Talk — Private video meetings</title>
    <meta name="description" content="Instant, end-to-end encrypted video meetings. No account required." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d10" />

    <!--
      Meeting links carry the encryption key in the URL fragment. A referrer
      header would leak the full URL to any third party; `no-referrer` makes
      that structurally impossible.
    -->
    <meta name="referrer" content="no-referrer" />
    <!-- Meeting URLs must never be indexed or archived. -->
    <meta name="robots" content="noindex, nofollow, noarchive" />

    <!--
      Link preview.

      Safe precisely because the encryption key lives in the URL fragment:
      when a chat app builds a preview it fetches the URL over HTTP, and
      fragments are never transmitted in a request. The crawler therefore sees
      this page and learns nothing about the meeting.

      The text is deliberately generic for the same reason — a preview naming
      the meeting or its participants would leak into every group chat the
      invitation passes through, and unlike the key that *would* travel.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NME Talk" />
    <meta property="og:title" content="You're invited to a meeting" />
    <meta
      property="og:description"
      content="Click the link to join. No account, no install. End-to-end encrypted."
    />
    <meta property="og:image" content="/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NME Talk — end-to-end encrypted video meetings" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="You're invited to a meeting" />
    <meta
      name="twitter:description"
      content="Click the link to join. No account, no install. End-to-end encrypted."
    />
    <meta name="twitter:image" content="/preview.png" />

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        NME Talk needs JavaScript to encrypt and transmit media in your browser.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
